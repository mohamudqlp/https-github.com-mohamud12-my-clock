<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#12101c">
    <title>Video Studio</title>
    <link rel="stylesheet" href="video-player.css">
</head>
<body>
    <main class="app">
        <header class="app-header">
            <h1>Video Studio</h1>
            <p class="tagline">Import a video, then bend its speed and pitch.</p>
        </header>

        <section id="dropzone" class="dropzone" aria-label="Import a video">
            <input type="file" id="file-input" accept="video/*" class="visually-hidden">
            <label for="file-input" class="dropzone-label">
                <span class="dropzone-icon" aria-hidden="true">&#9654;</span>
                <span class="dropzone-title">Choose a video</span>
                <span class="dropzone-hint">or drop a file here</span>
            </label>
        </section>

        <section class="stage" id="stage" hidden>
            <div class="video-frame">
                <video id="video" playsinline preload="metadata"></video>
            </div>

            <p class="file-name" id="file-name"></p>

            <div class="transport">
                <button type="button" id="play-btn" class="icon-btn primary" aria-label="Play">
                    <span id="play-icon" aria-hidden="true">&#9654;</span>
                </button>
                <div class="seek-group">
                    <input type="range" id="seek" class="seek" min="0" max="100" step="0.1" value="0"
                           aria-label="Seek">
                    <div class="time-row">
                        <span id="current-time">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                </div>
                <button type="button" id="mute-btn" class="icon-btn" aria-label="Mute">
                    <span id="mute-icon" aria-hidden="true">&#128266;</span>
                </button>
            </div>

            <div class="controls">
                <div class="control">
                    <div class="control-head">
                        <label for="speed">Playback speed</label>
                        <output id="speed-value" for="speed">1.00&times;</output>
                    </div>
                    <input type="range" id="speed" min="0.25" max="2.5" step="0.05" value="1">
                    <div class="presets" role="group" aria-label="Speed presets">
                        <button type="button" class="chip" data-speed="0.5">0.5&times;</button>
                        <button type="button" class="chip" data-speed="1">1&times;</button>
                        <button type="button" class="chip" data-speed="1.5">1.5&times;</button>
                        <button type="button" class="chip" data-speed="2">2&times;</button>
                    </div>
                </div>

                <div class="control">
                    <div class="control-head">
                        <label for="pitch">Pitch</label>
                        <output id="pitch-value" for="pitch">0 st</output>
                    </div>
                    <input type="range" id="pitch" min="-12" max="12" step="1" value="0">
                    <div class="presets" role="group" aria-label="Pitch presets">
                        <button type="button" class="chip" data-pitch="-12">-12 st</button>
                        <button type="button" class="chip" data-pitch="-5">-5 st</button>
                        <button type="button" class="chip" data-pitch="0">0 st</button>
                        <button type="button" class="chip" data-pitch="7">+7 st</button>
                    </div>
                </div>

                <label class="switch">
                    <input type="checkbox" id="preserve-pitch" checked>
                    <span>Keep original pitch when speed changes</span>
                </label>

                <div class="actions">
                    <button type="button" id="reset-btn" class="ghost-btn">Reset audio</button>
                    <button type="button" id="change-btn" class="ghost-btn">Load another video</button>
                </div>
            </div>

            <p class="status" id="status" role="status" aria-live="polite"></p>
        </section>
    </main>

    <script src="video-player.js"></script>
</body>
</html>
