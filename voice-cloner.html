<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky Hopper</title>
  <style>
    :root { --ink: #14213d; --yellow: #ffc700; --coral: #ff5d5d; --sky: #8cdcff; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; font-family: Arial, sans-serif; color: var(--ink); background: #f7c85b; }
    .game-shell { width: min(100%, 480px); height: min(100vh, 780px); position: relative; overflow: hidden; isolation: isolate; background: linear-gradient(#78d5f7 0 67%, #d7f4ff 67% 76%, #81c34b 76%); border: 8px solid #fff8dc; box-shadow: 0 12px 0 #b47626, 0 24px 45px rgba(74, 55, 20, .28); }
    .cloud { position: absolute; width: 96px; height: 28px; background: #fff; border-radius: 50px; opacity: .9; z-index: 1; }
    .cloud::before, .cloud::after { content: ''; position: absolute; bottom: 7px; background: #fff; border-radius: 50%; }
    .cloud::before { width: 42px; height: 42px; left: 14px; } .cloud::after { width: 34px; height: 34px; right: 13px; }
    .cloud-a { top: 125px; left: 35px; transform: scale(.62); } .cloud-b { top: 260px; right: 28px; transform: scale(.92); } .cloud-c { top: 58px; right: 70px; transform: scale(.42); }
    .hud { position: absolute; z-index: 8; top: 22px; left: 24px; right: 24px; display: flex; justify-content: space-between; align-items: flex-start; font-weight: 900; }
    .score-box { text-align: center; color: white; text-shadow: 0 3px 0 #397d9f; } .score { font-size: 50px; line-height: .8; letter-spacing: -3px; } .score-label { margin-top: 8px; font-size: 11px; letter-spacing: 1.8px; }
    .best { padding: 9px 10px 8px; background: rgba(255,255,255,.82); border: 3px solid white; border-radius: 12px; box-shadow: 0 3px 0 rgba(54,104,125,.2); font-size: 11px; letter-spacing: 1px; text-align: center; } .best strong { display: block; margin-top: 3px; color: #ee7b32; font-size: 20px; letter-spacing: 0; }
    .bird { position: absolute; z-index: 5; width: 52px; height: 40px; left: 90px; top: 320px; border: 3px solid var(--ink); border-radius: 55% 52% 48% 52%; background: var(--yellow); box-shadow: inset -6px -5px 0 #ee9d00; transform-origin: center; transition: transform .08s linear; }
    .bird::before { content: ''; position: absolute; width: 23px; height: 15px; left: -13px; top: 17px; border: 3px solid var(--ink); border-radius: 60% 15% 55% 50%; background: #f7a928; transform: rotate(-25deg); }
    .bird::after { content: ''; position: absolute; width: 13px; height: 13px; right: 8px; top: 7px; border-radius: 50%; background: white; border: 3px solid var(--ink); box-shadow: 3px 1px 0 -1px var(--ink); }
    .beak { position: absolute; z-index: 6; left: 136px; top: 336px; width: 0; height: 0; border-top: 9px solid transparent; border-bottom: 9px solid transparent; border-left: 17px solid var(--coral); filter: drop-shadow(2px 0 var(--ink)); }
    .pipe { position: absolute; z-index: 4; width: 68px; background: #53ba5e; border: 3px solid #236b3c; box-shadow: inset 8px 0 #81d770, inset -8px 0 #258c49; }
    .pipe::after { content: ''; position: absolute; left: -8px; width: 78px; height: 26px; border: 3px solid #236b3c; background: #68ca67; box-shadow: inset 8px 0 #94e577, inset -8px 0 #319e4e; }
    .pipe.top { top: 0; } .pipe.top::after { bottom: 0; } .pipe.bottom { bottom: 88px; } .pipe.bottom::after { top: 0; }
    .ground { position: absolute; z-index: 7; inset: auto 0 0; height: 89px; border-top: 5px solid #498d35; background: repeating-linear-gradient(135deg, #75bd45 0 18px, #8dcc52 18px 36px); }
    .ground::after { content: ''; position: absolute; inset: 14px 0 0; border-top: 5px solid #e4bb50; background: #cf8d43; }
    .panel { position: absolute; z-index: 10; inset: 0; display: grid; place-items: center; padding: 26px; background: linear-gradient(rgba(54,173,220,.04), rgba(54,173,220,.18)); }
    .card { width: min(100%, 330px); padding: 26px 22px 20px; text-align: center; background: #fff9e7; border: 4px solid white; border-radius: 22px; box-shadow: 0 8px 0 rgba(31,96,123,.23), 0 15px 35px rgba(20,68,91,.2); }
    .eyebrow { margin: 0 0 9px; color: #ed7c31; font-size: 12px; font-weight: 900; letter-spacing: 2px; } h1 { margin: 0; font-size: 37px; letter-spacing: -2px; } .card p { margin: 13px 0 21px; line-height: 1.45; font-size: 14px; font-weight: bold; }
    button { width: 100%; padding: 15px; border: 0; border-radius: 12px; cursor: pointer; color: var(--ink); background: var(--yellow); box-shadow: 0 5px 0 #d69100; font-size: 16px; font-weight: 900; letter-spacing: .5px; } button:active { transform: translateY(4px); box-shadow: 0 1px 0 #d69100; } .tips { margin: 17px 0 0; color: #5d715d; font-size: 11px; font-weight: bold; }
    .hidden { display: none; }
    @media (max-width: 500px) { .game-shell { border-width: 0; width: 100vw; height: 100vh; } }
  </style>
</head>
<body>
  <main class="game-shell" aria-label="Sky Hopper arcade game">
    <div class="cloud cloud-a"></div><div class="cloud cloud-b"></div><div class="cloud cloud-c"></div>
    <header class="hud"><div class="score-box"><div class="score" id="score">0</div><div class="score-label">SCORE</div></div><div class="best">BEST<strong id="best">0</strong></div></header>
    <div class="bird" id="bird" aria-label="Bird"></div><div class="beak" id="beak"></div>
    <div class="ground"></div>
    <section class="panel" id="panel"><div class="card"><p class="eyebrow" id="panel-kicker">ARCADE FLIGHT</p><h1 id="panel-title">Sky Hopper</h1><p id="panel-copy">Thread the gaps, beat your best, and keep the little yellow hopper in the sky.</p><button id="start-button" type="button">START FLYING</button><div class="tips">PRESS SPACE, ↑, OR TAP TO FLAP</div></div></section>
  </main>
  <script>
    (() => {
      const game = document.querySelector('.game-shell'); const bird = document.querySelector('#bird'); const beak = document.querySelector('#beak'); const scoreEl = document.querySelector('#score'); const bestEl = document.querySelector('#best'); const panel = document.querySelector('#panel'); const title = document.querySelector('#panel-title'); const kicker = document.querySelector('#panel-kicker'); const copy = document.querySelector('#panel-copy'); const start = document.querySelector('#start-button');
      const state = { running: false, birdY: 320, velocity: 0, score: 0, pipes: [], lastTime: 0, spawnAt: 0, best: Number(localStorage.getItem('skyHopperBest') || 0) };
      bestEl.textContent = state.best;
      const flap = () => { if (state.running) state.velocity = -8.2; };
      const reset = () => { state.birdY = 320; state.velocity = 0; state.score = 0; state.pipes.forEach(p => p.el.remove()); state.pipes = []; scoreEl.textContent = '0'; bird.style.top = '320px'; beak.style.top = '336px'; bird.style.transform = 'rotate(0deg)'; };
      const addPipe = () => { const gap = 165; const topHeight = 110 + Math.random() * 250; const x = game.clientWidth + 20; const top = document.createElement('div'); const bottom = document.createElement('div'); top.className = 'pipe top'; bottom.className = 'pipe bottom'; top.style.cssText += `height:${topHeight}px;left:${x}px`; bottom.style.cssText += `height:${game.clientHeight - 88 - topHeight - gap}px;left:${x}px`; game.insertBefore(top, document.querySelector('.ground')); game.insertBefore(bottom, document.querySelector('.ground')); state.pipes.push({ x, topHeight, passed: false, el: top, bottom }); };
      const endGame = () => { state.running = false; if (state.score > state.best) { state.best = state.score; localStorage.setItem('skyHopperBest', state.best); } bestEl.textContent = state.best; kicker.textContent = state.score > 0 ? 'NICE FLIGHT!' : 'OOPS!'; title.textContent = 'Flight over'; copy.innerHTML = `You scored <strong>${state.score}</strong>. Your best is <strong>${state.best}</strong> — ready for another run?`; start.textContent = 'FLY AGAIN'; panel.classList.remove('hidden'); };
      const tick = (time) => { if (!state.running) return; const elapsed = Math.min((time - state.lastTime) / 16.67, 2); state.lastTime = time; state.velocity += .43 * elapsed; state.birdY += state.velocity * elapsed; bird.style.top = `${state.birdY}px`; beak.style.top = `${state.birdY + 16}px`; bird.style.transform = `rotate(${Math.max(-25, Math.min(75, state.velocity * 5))}deg)`; if (time > state.spawnAt) { addPipe(); state.spawnAt = time + 1450; }
        const birdX = 90, birdW = 52, birdH = 40; state.pipes.forEach(p => { p.x -= 2.55 * elapsed; p.el.style.left = `${p.x}px`; p.bottom.style.left = `${p.x}px`; if (!p.passed && p.x + 68 < birdX) { p.passed = true; state.score++; scoreEl.textContent = state.score; } }); state.pipes = state.pipes.filter(p => { if (p.x < -85) { p.el.remove(); p.bottom.remove(); return false; } return true; }); const hitPipe = state.pipes.some(p => birdX + birdW - 5 > p.x && birdX + 5 < p.x + 68 && (state.birdY + 4 < p.topHeight || state.birdY + birdH - 4 > p.topHeight + 165)); if (state.birdY < 0 || state.birdY + birdH > game.clientHeight - 88 || hitPipe) { endGame(); return; } requestAnimationFrame(tick); };
      const startGame = () => { reset(); panel.classList.add('hidden'); state.running = true; state.lastTime = performance.now(); state.spawnAt = state.lastTime + 1100; requestAnimationFrame(tick); };
      start.addEventListener('click', startGame); game.addEventListener('pointerdown', event => { if (!event.target.closest('button')) flap(); }); window.addEventListener('keydown', event => { if ([' ', 'ArrowUp'].includes(event.key)) { event.preventDefault(); flap(); } });
      window.skyHopper = { startGame, flap, state };
    })();
  </script>
</body>
</html>
